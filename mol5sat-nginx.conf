# ═══════════════════════════════════════════════════════════════
#  NGINX CONFIG — mol5sat.org
#
#  One domain. One Express server. One database.
#  The React Native app calls /api/ directly — no web serving needed.
#
#  Setup:
#    sudo cp mol5sat-nginx.conf /etc/nginx/sites-available/mol5sat
#    sudo ln -s /etc/nginx/sites-available/mol5sat /etc/nginx/sites-enabled/
#    sudo certbot --nginx -d mol5sat.org -d www.mol5sat.org
#    sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name mol5sat.org www.mol5sat.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mol5sat.org www.mol5sat.org;

    ssl_certificate     /etc/letsencrypt/live/mol5sat.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mol5sat.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # CORS — lets the React Native app call the API from any origin
    add_header Access-Control-Allow-Origin  "*"                                            always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS"            always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-Id"   always;

    if ($request_method = OPTIONS) { return 204; }

    client_max_body_size 55M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    access_log /var/log/nginx/mol5sat.access.log;
    error_log  /var/log/nginx/mol5sat.error.log warn;
}
